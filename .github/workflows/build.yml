name: Build AeroFlow Installer

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyarmor==7.7.4" pyinstaller
          pip install -r requirements.txt

      - name: Obfuscate source with PyArmor
        run: pyarmor obfuscate --output obf APP_UNIFICADO_SAP_CH.py

      - name: Build executable with PyInstaller
        run: python build_installer.py

      - name: Install Inno Setup
        run: choco install innosetup --yes

      - name: Extract version from tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          echo "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Compile installer
        run: iscc /DMyAppVersion=${{ steps.version.outputs.version }} instalador.iss

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AeroFlow ${{ github.ref_name }}
          files: Output/AeroFlow_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
